# OpenAPI 3.1 description of warehouse-ops-agent's REST console API.
#
# Kept in sync with internal/adapters/inbound/http/router.go (the chi
# wiring) — every route below is registered there and nowhere else, and
# every non-2xx answer is an RFC 9457 application/problem+json document
# produced by problem.go's writeProblem (portfolio rec, 2026-11-02).
# Error details are caller-safe: handler-authored sentences or a fixed
# sentence plus the upstream's ADR 0018 classification slug; upstream
# free text never appears in a response body.
openapi: 3.1.0
info:
  title: warehouse-ops-agent REST console
  version: 1.0.0
  summary: Read-only operational console API plus the human-gated act slice.
  contact:
    name: warehouse-ops-agent maintainers
    url: https://github.com/IQVO/warehouse-ops-agent
  description: >
    Thirteen GET routes (health, daily brief, flow-balance, travel-factor
    explanation, the console-bff order-lifecycle and WMS/WES dashboards,
    runtime signals, master-data gaps, inbound outlook, transfer watch)
    and the four POST routes of the two human-gated act slices (ADR 0027,
    ADR 0029). Every POST takes an Idempotency-Key (ADR 0030, fleet REST
    guideline section 2). Optional capabilities that the composition root
    has not wired answer 503 with problem type not-configured rather than
    panicking.
servers:
  - url: http://localhost:8080
    description: Local console (port follows PORT).
tags:
  - name: health
  - name: briefs
  - name: console
  - name: network
  - name: act
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe.
      operationId: getHealthz
      description: >
        Liveness probe: answers 200 with status ok while the process is
        serving. It checks no upstream.
      responses:
        "200":
          description: The agent is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /daily-brief:
    get:
      tags: [briefs]
      summary: The shift-start operational brief.
      operationId: getDailyBrief
      description: >
        Assembles the shift-start operational brief from the MCP read
        tools of the wired upstream contexts.
      responses:
        "200":
          description: The assembled brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
  /flow-balance/{pathId}:
    get:
      tags: [briefs]
      summary: Correlated staffing/flow advisory for one process path.
      operationId: getFlowBalanceException
      description: >
        Correlates the workforce-management staffing gap for the building
        and shift with the flow on one process path and returns the
        advisory decision. buildingId and shiftId are required; an unwired
        flow-balance advisory answers 503 not-configured.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: buildingId
          in: query
          required: true
          schema: { type: string }
          description: Workforce-management building scope.
        - name: shiftId
          in: query
          required: true
          schema: { type: string }
          description: Workforce-management shift scope.
      responses:
        "200":
          description: The advisory decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /explain-travel-factor:
    get:
      tags: [briefs]
      summary: Explain the travel distance factor between two locations.
      operationId: getExplainTravelFactor
      description: >
        facility-layout rejection of a malformed code is a 400 (the
        caller's input); any other upstream failure is a 502, never
        blamed on the caller (ADR 0016/0018).
      parameters:
        - name: pathId
          in: query
          required: true
          schema: { type: string }
        - name: fromLocationCode
          in: query
          required: true
          schema: { type: string }
          description: Seven-segment facility-layout location code.
        - name: toLocationCode
          in: query
          required: true
          schema: { type: string }
          description: Seven-segment facility-layout location code.
      responses:
        "200":
          description: The travel reading and its correlation, when produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /console/orders/{id}/lifecycle:
    get:
      tags: [console]
      summary: Order lifecycle read model for the console shell.
      operationId: getOrderLifecycle
      description: >
        Order lifecycle read model for the console shell. An order order-
        management does not know is a 404; any other upstream failure
        degrades that one stage to null in a 200 response (partial-
        tolerant, ADR 0002), so there is no 502 branch. An unwired use
        case answers 503.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Customer order id.
      responses:
        "200":
          description: The order's lifecycle view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /console/reports/wms:
    get:
      tags: [console]
      summary: WMS chart dashboard (order funnel, flow accuracy, catalog growth).
      operationId: getWMSDashboard
      description: >
        WMS chart dashboard for the window from..to (defaults to the
        trailing 24 hours): order funnel, flow accuracy and catalog
        growth. Each section carries its own availability.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 window start; defaults to trailing 24h.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 window end; must be after "from".
      responses:
        "200":
          description: The dashboard; each section carries its own availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /console/reports/wes:
    get:
      tags: [console]
      summary: WES chart dashboard (queue status, stuck tasks, station standards, labor).
      operationId: getWESDashboard
      description: >
        WES chart dashboard for the window from..to (defaults to the
        trailing 24 hours): queue status, stuck tasks, station standards
        and labor. Each section carries its own availability.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The dashboard; each section carries its own availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /runtime-signals:
    get:
      tags: [briefs]
      summary: Phase 5 runtime-feedback signals.
      operationId: getRuntimeSignals
      description: >
        Phase 5 runtime-feedback signals. An unwired runtime-signals use
        case answers 503 not-configured, the same convention as every
        optional route.
      responses:
        "200":
          description: The runtime signals view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "503": { $ref: "#/components/responses/NotConfigured" }
  /master-data-gaps:
    get:
      tags: [network]
      summary: Product-master gap report (ADR 0020).
      operationId: getMasterDataGaps
      description: >
        Product-master products that are unclassified or whose declared
        and measured dimensions disagree (ADR 0020). An unknown kind or a
        cursor product-master rejects is a 400, product-master unreachable
        is a 502, and an unwired use case (PRODUCT_MASTER_MCP_ENDPOINT
        unset) is a 503.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: Restrict to one gap kind.
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Resume token from a previous page.
      responses:
        "200":
          description: The gap report with completeness flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /inbound-outlook:
    get:
      tags: [network]
      summary: Inbound-receiving outlook (ADR 0021).
      operationId: getInboundOutlook
      description: >
        The dock side near-term picture read from inbound-receiving (ADR
        0021): ASNs awaiting arrival, appointments in the next 24 hours,
        open receipts older than INBOUND_STALE_RECEIPT_AGE and receipts
        closed with discrepancies today. Takes no parameters; each section
        carries its own omitted reason and complete flag. Every section
        unreachable is a 502; an unwired use case is a 503.
      responses:
        "200":
          description: The inbound outlook; each section carries its own reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /transfer-watch/stuck:
    get:
      tags: [network]
      summary: Stuck network transfers (ADR 0019).
      operationId: getStuckTransfers
      description: >
        Network transfers stuck longer than olderThanMinutes (ADR 0019).
        olderThanMinutes is required and must be positive: the agent never
        picks a staleness threshold on the operator behalf.
      parameters:
        - name: olderThanMinutes
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
          description: Staleness threshold; the agent never picks one itself.
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: The stuck-transfer list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /transfer-watch/transfers/{id}:
    get:
      tags: [network]
      summary: One transfer's status.
      operationId: getTransferStatus
      description: >
        Status of one network transfer, read from network-inventory-
        planning (ADR 0019).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The transfer status view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /transfer-watch/imbalance:
    get:
      tags: [network]
      summary: Network inventory imbalance view.
      operationId: getNetworkImbalance
      description: >
        Network inventory imbalance view, read from network-inventory-
        planning (ADR 0019).
      responses:
        "200":
          description: The imbalance view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /act/release-next-work/proposals:
    post:
      tags: [act]
      summary: Propose the release of the next work unit (ADR 0027).
      operationId: postReleaseProposal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: >
        The human-gated act slice: returns a confirmation token the
        operator must present to /approvals. This route — and its sibling
        approval route — is one of the two write surfaces of this agent
        (the other is /labor-reallocation, ADR 0029).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingId, shiftId, pathId]
              properties:
                buildingId: { type: string }
                shiftId: { type: string }
                pathId: { type: string }
      responses:
        "200":
          description: The proposal with its confirmation token and expiry.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /act/release-next-work/approvals:
    post:
      tags: [act]
      summary: Confirm and execute a proposal with its token (ADR 0027).
      operationId: postReleaseApproval
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: >
        Second step of the human-gated release act slice (ADR 0027): the
        operator presents the confirmation token returned by /proposals
        and the agent executes that one release. An expired token is a
        410; an unknown work-planning path or assignment id is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The executed release.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /labor-reallocation/proposals:
    post:
      tags: [act]
      summary: Propose labor reallocation moves (ADR 0029).
      operationId: postReallocationProposal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      description: >
        Second human-gated act slice. Ranks at most three moves of the
        caller-supplied candidates onto an understaffed path and returns one
        confirmation token per move. Nothing is executed until the matching
        approvals route is called with that token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteCode, shiftId, toPathId, candidates]
              properties:
                siteCode: { type: string }
                shiftId: { type: string }
                toPathId: { type: string }
                candidates:
                  type: array
                  items:
                    type: object
                    required: [associateId]
                    properties:
                      associateId: { type: string }
                      fromPathId: { type: string }
      responses:
        "200":
          description: The ranked proposals, each with its token and expiry.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
  /labor-reallocation/proposals/{proposalId}/approvals:
    post:
      tags: [act]
      summary: Approve one move and delegate assign_labor (ADR 0029, ADR 0031).
      operationId: postReallocationApproval
      description: >
        Second step of the labor-reallocation act slice (ADR 0029):
        records an approval of one proposed move with its confirmation
        token and approver, and delegates the assignment to
        workforce-management assign_labor. An expired token is a 410.
        This route replaces POST .../{proposalId}/approve (ADR 0031): the
        old verb route is not part of this contract; it still answers,
        keyless and unchanged, with the headers Deprecation, Sunset
        (Wed, 10 Feb 2027 00:00:00 GMT) and Link rel="successor-version"
        until that date.
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, approvedBy]
              properties:
                token: { type: string }
                approvedBy: { type: string }
      responses:
        "200":
          description: The executed assignment.
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJSON"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "502": { $ref: "#/components/responses/UpstreamUnavailable" }
        "503": { $ref: "#/components/responses/NotConfigured" }
components:
  parameters:
    PathId:
      name: pathId
      in: path
      required: true
      schema: { type: string }
      description: Canonical process-path id.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated key (e.g. a UUID v4) that makes a retried act
        request safe (ADR 0030). Required on every POST: the key store is
        wired in every runtime mode, and a request without the header is a
        400 idempotency-key-required. Reuse the SAME key for retries of one
        logical submit (same body): the first answer, success or business
        error, is stored for 24 hours and replayed byte for byte with
        Idempotency-Replayed: true, without running the act again. Use a NEW
        key for each new submit. Reusing a key with a different method, path
        or body is a 409 idempotency-key-reused. A key that is not 1-128
        printable ASCII characters starting and ending with a visible
        character is a 400 idempotency-key-invalid. The pattern describes
        the header as sent on the wire: the key, optionally followed by
        spaces or tabs, which are HTTP optional whitespace that the HTTP
        stack drops before the service reads the value (RFC 9110 section
        5.5), so they are never part of the key. A 5xx answer is never
        stored, so its retry runs again; the single-use confirmation token
        still allows at most one delegation (ADR 0027).
      schema:
        type: string
        minLength: 1
        pattern: '^[!-~]([ -~]{0,126}[!-~])?[ \t]*$'
      example: 3f1d6a4e-9c0b-4a39-8f0f-5b2d1c7e9a10
  headers:
    IdempotencyReplayed:
      description: >-
        "true" when this answer is the stored answer of an earlier request
        with the same Idempotency-Key, method, path and body; absent on a
        first execution.
      schema:
        type: string
        enum: ["true"]
  responses:
    BadRequest:
      description: >-
        The request itself is invalid (missing/invalid parameters or body),
        or, on a POST, the Idempotency-Key header is missing
        (idempotency-key-required) or malformed (idempotency-key-invalid).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: The addressed entity does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >-
        The act slice's precondition failed (token already used, no pending
        work, policy does not recommend), or the Idempotency-Key was already
        used with a different request (problem type idempotency-key-reused).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: The confirmation token has expired.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The request body exceeds the act-slice limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Internal:
      description: An unexpected internal failure.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamUnavailable:
      description: An upstream context failed or is unreachable (never the caller's fault).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotConfigured:
      description: The capability behind this route is not wired in this deployment.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem details. The detail member is caller-safe by
        construction — authored sentences, or a fixed sentence plus the
        upstream's ADR 0018 slug. Upstream prose never appears.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable problem identifier URI.
          examples:
            - https://problems.warehouse-ops-agent.io/upstream-unavailable
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    GenericJSON:
      type: object
      additionalProperties: true
      description: >
        Response body of the read routes. The concrete DTO shapes are
        pinned by the golden/contract tests in
        internal/adapters/inbound/http (testdata) and the godog suite in
        features/; this document pins paths, parameters, statuses and the
        error contract.
