# Default values for warehouse-ops-agent.

replicaCount: 1

image:
  repository: ghcr.io/iqvo/warehouse-ops-agent
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8095

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: warehouse-ops-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress block above.
# Mirrors the shape verified live in warehouse-infra's fulfillment-execution
# Gateway API pilot (Kong's Ingress Controller routes HTTPRoute traffic once
# the GatewayClass carries konghq.com/gatewayclass-unmanaged: "true"). Flip
# gatewayApi.enabled: true and set real parentRefs to switch this service
# from Ingress to HTTPRoute; leaving it false is a strict no-op.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HPA (ADR 0012). Default-disabled: enabling this changes nothing about
# production replica counts on merge. CPU is the only metric wired for
# v1 (targetMemoryUtilizationPercentage is left null/omitted here on
# purpose -- most of this agent's per-request cost is waiting on
# upstream MCP/REST/LLM I/O, not allocating; CPU is still an honest
# v1 signal per the fleet plan's own "CPU/memory initially, then a
# custom metric once a baseline exists" guidance). min1/max3, not
# order-management's api min1/max4 -- this is a single-Deployment,
# lower-traffic decision-support aggregator, not an OLTP API sized
# against a shared Postgres connection budget.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 0  # uncomment + set to also gate on memory

# This agent is a stateless MCP-client aggregator: no database, no Kafka.
# config.agentAddr is its own listen address, serving BOTH the inbound HTTP
# routes (/healthz, /daily-brief, /flow-balance/{pathId}) and the inbound
# MCP server (/mcp) on the SAME http.Server/mux — one containerPort covers
# both (see cmd/agent/main.go).
config:
  agentAddr: ":8095"
  logLevel: "info"
  # dailyBriefPathTargets overrides DAILY_BRIEF_PATH_TARGETS (a JSON array).
  # Left empty, the binary falls back to its own built-in default target
  # (see internal/config/config.go) so an unset override still produces a
  # working brief rather than an empty one.
  dailyBriefPathTargets: ""

# The console-bff order-lifecycle fan-out's own plain REST base URLs — a
# SEPARATE concern from the MCP `upstreams` block below (that block backs
# the daily-brief/flow-balance LLM-facing use cases; this one backs
# internal/adapters/outbound/restclient, wired in cmd/agent/main.go). All
# default to "" (unconfigured); the binary's own restclient adapters decide
# how to degrade a missing URL, this chart never guesses on its behalf.
restUrls:
  orderManagement: ""
  inventoryStorage: ""
  wesWorkPlanning: ""
  fulfillmentExecution: ""

# Each context's ANALYTICS reader base URL, used ONLY by the console-bff's
# WMS/WES dashboard fan-out (GET /console/reports/wms and /wes). These
# point at each repo's separate *-reports binary/Service -- a different
# process, backed by a different analytical Postgres, from restUrls above.
# All default to "" (unconfigured); the binary's own restclient adapters
# decide how to degrade a missing URL (a section renders available:false,
# not a crash) -- this chart never guesses on its behalf.
reportsUrls:
  orderManagement: ""
  inventoryStorage: ""
  wesWorkPlanning: ""
  fulfillmentExecution: ""
  workforceManagement: ""
  facilityLayout: ""
  laborPerformance: ""

# Every upstream is a Streamable-HTTP MCP endpoint on one of the fleet's
# eight bounded-context services. All default to "" (unconfigured); the
# binary itself decides how to degrade a missing upstream (skip vs.
# partial brief) — this chart never guesses on its behalf.
#
# orderManagement/laborPerformance/processPathManagement are the second
# wave (warehouse-ops-agent PR #44): their outbound mcpclient ports and
# concrete clients exist in the composition root, but until a consuming
# use case is wired the endpoint here is inert plumbing — see each one's
# own consumption status. labor-performance graduated to actually
# consumed by FlowBalanceAdvisory in PR #45 (ADR 0008); this chart's
# upstreams block was not updated in that PR, which is the bug this
# change fixes — the client existed and was called, but the endpoint
# reaching it from a real deploy was always "".
upstreams:
  wesWorkPlanning:
    endpoint: ""
  fulfillmentExecution:
    endpoint: ""
  inventoryStorage:
    endpoint: ""
  workforceManagement:
    endpoint: ""
  facilityLayout:
    endpoint: ""
  orderManagement:
    endpoint: ""
  laborPerformance:
    endpoint: ""
  processPathManagement:
    endpoint: ""

# warehouse-infra Prometheus base URL, for the telemetry-reader port's real
# implementation (not yet wired — safe to leave empty).
prometheus:
  url: ""

# Static credentials. All lands in one generated Secret unless
# existingSecret names a Secret you manage yourself (its key names must
# match the env var names read by internal/config).
credentials:
  existingSecret: ""
  # Anthropic API key for the ADR 0004 reasoner. Required (and validated
  # at startup) whenever llm.mode is not "off"; never logged.
  anthropicApiKey: ""

# ---------------------------------------------------------------------------
# Model-backed reasoner (ADR 0004). The deterministic policy always runs;
# mode decides whether the model's plan can replace its result:
#   off    - never call the model (default; pre-ADR behaviour byte-for-byte)
#   shadow - call it, log + count agreement, return the deterministic decision
#   on     - use a valid plan, fall back to deterministic on error/timeout/
#            out-of-vocabulary
# The model's ONLY actuators are the MCP read tools in toolAllowList
# (<upstream>/<tool>), invoked with this agent's read keys above.
# ---------------------------------------------------------------------------
llm:
  mode: "off"
  model: ""          # empty = adapter default (claude-sonnet-4-5)
  timeout: "8s"
  toolAllowList: []  # empty = binary default (the flow-balance read tools)

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a
# Collector; the service never exposes a Prometheus scrape endpoint of its
# own. An unreachable endpoint is not fatal -- the exporters dial lazily,
# so the pod still starts and serves, it just drops telemetry. Endpoint
# matches the rest of the fleet (fulfillment-execution, workforce-management,
# facility-layout).
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "warehouse-ops-agent"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
