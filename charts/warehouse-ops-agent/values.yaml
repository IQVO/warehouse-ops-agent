# Default values for warehouse-ops-agent.

replicaCount: 1

image:
  repository: ghcr.io/iqvo/warehouse-ops-agent
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8095

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: warehouse-ops-agent.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress block above.
# Mirrors the shape verified live in warehouse-infra's fulfillment-execution
# Gateway API pilot (Kong's Ingress Controller routes HTTPRoute traffic once
# the GatewayClass carries konghq.com/gatewayclass-unmanaged: "true"). Flip
# gatewayApi.enabled: true and set real parentRefs to switch this service
# from Ingress to HTTPRoute; leaving it false is a strict no-op.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever — the fleet's endpoints
# are unauthenticated and the gateway adds no authentication or
# authorization. (This chart has no mcp/reports workloads — the console-bff
# HTTPRoute is its only Kong surface.)
kongPlugins:
  cors:
    enabled: false
    # Exact browser origin, never "*" (endpoints are unauthenticated).
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    # OTLP/HTTP traces endpoint of the fleet collector; needs Kong started
    # with KONG_TRACING_INSTRUMENTATIONS or the plugin exports zero spans.
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HPA (ADR 0012). Default-disabled: enabling this changes nothing about
# production replica counts on merge. CPU is the only metric wired for
# v1 (targetMemoryUtilizationPercentage is left null/omitted here on
# purpose -- most of this agent's per-request cost is waiting on
# upstream MCP/REST/LLM I/O, not allocating; CPU is still an honest
# v1 signal per the fleet plan's own "CPU/memory initially, then a
# custom metric once a baseline exists" guidance). min1/max3, not
# order-management's api min1/max4 -- this is a single-Deployment,
# lower-traffic decision-support aggregator, not an OLTP API sized
# against a shared Postgres connection budget.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 0  # uncomment + set to also gate on memory

# This agent is a stateless MCP-client aggregator: no database, no Kafka.
# config.agentAddr is its own listen address, serving BOTH every inbound
# REST route (all GET; the full list is docs/docs/api/http-routes.md and
# the startup log line's http_routes field) and the inbound MCP server
# (/mcp) on the SAME chi.Mux -- one containerPort covers both, and /mcp
# gets the identical otelchi/otelchimetric/RequestLogger middleware chain
# every REST route does (ADR 0010; see cmd/agent/main.go and
# internal/adapters/inbound/http/router.go).
config:
  agentAddr: ":8095"
  # LOG_LEVEL: debug, info, warn (or warning), error; anything else = info.
  logLevel: "info"
  # corsAllowedOrigins sets CORS_ALLOWED_ORIGINS: the comma-separated
  # browser origins (warehouse-console) allowed to call the REST routes,
  # e.g. "http://console.warehouse.local,http://localhost:5173". Left
  # empty the key is not rendered and the binary allows only its local-dev
  # default, http://localhost:5173. Only GET and OPTIONS are allowed
  # cross-origin either way (ADR 0016).
  corsAllowedOrigins: ""
  # dailyBriefPathTargets overrides DAILY_BRIEF_PATH_TARGETS (a JSON array).
  # Left empty, the binary falls back to its own built-in default target
  # (see internal/config/config.go) so an unset override still produces a
  # working brief rather than an empty one. Do NOT set it to "[]": an empty
  # list fails startup with a config error (ADR 0017) -- leave it empty.
  dailyBriefPathTargets: ""
  # inboundStaleReceiptAge overrides INBOUND_STALE_RECEIPT_AGE (a Go
  # duration, e.g. "4h"): an Open receipt older than this appears in the
  # inbound outlook (ADR 0021). Left empty the "stale receipts" section is
  # omitted (no default is invented). Only has an effect when
  # upstreams.inboundReceiving.endpoint is set.
  inboundStaleReceiptAge: ""
  # capacityOutlookHorizon overrides CAPACITY_OUTLOOK_HORIZON (a Go
  # duration, e.g. "8h"): how far ahead the daily brief's warehouse-planning
  # capacity window extends. Left empty the binary uses its own 8h default.
  # Only has an effect when upstreams.warehousePlanning.endpoint is set. The
  # per-path planning binding (planningPathId, optional unitsPerOrder /
  # packagesPerOrder -- no defaults, operator-supplied only) lives in the
  # dailyBriefPathTargets JSON above.
  capacityOutlookHorizon: ""
  # slotPlanStaleAge overrides SLOT_PLAN_STALE_AGE (a Go duration, e.g.
  # "12h"): the approval age past which an Approved slot plan with
  # unexecuted moves is flagged in the daily brief's slotPlanWatch
  # section (ADR 0024). Left empty the binary uses its own 24h default.
  # Only has an effect when upstreams.slottingOptimization.endpoint is
  # set.
  slotPlanStaleAge: ""

# The console-bff order-lifecycle fan-out's own plain REST base URLs — a
# SEPARATE concern from the MCP `upstreams` block below (that block backs
# the daily-brief/flow-balance LLM-facing use cases; this one backs
# internal/adapters/outbound/restclient, wired in cmd/agent/main.go). All
# default to "" (unconfigured); the binary's own restclient adapters decide
# how to degrade a missing URL, this chart never guesses on its behalf.
restUrls:
  orderManagement: ""
  inventoryStorage: ""
  wesWorkPlanning: ""
  fulfillmentExecution: ""

# Each context's ANALYTICS reader base URL, used ONLY by the console-bff's
# WMS/WES dashboard fan-out (GET /console/reports/wms and /wes). These
# point at each repo's separate *-reports binary/Service -- a different
# process, backed by a different analytical Postgres, from restUrls above.
# All default to "" (unconfigured); the binary's own restclient adapters
# decide how to degrade a missing URL (a section renders available:false,
# not a crash) -- this chart never guesses on its behalf.
reportsUrls:
  orderManagement: ""
  inventoryStorage: ""
  wesWorkPlanning: ""
  fulfillmentExecution: ""
  workforceManagement: ""
  facilityLayout: ""
  laborPerformance: ""

# Every upstream is a Streamable-HTTP MCP endpoint on one of the fleet's
# bounded-context services. All default to "" (unconfigured): an empty
# endpoint builds no client (ADR 0023) and the use cases report that
# upstream as unavailable, or switch the feature off for the optional
# upstreams at the end of this block. This chart never guesses an
# endpoint on the binary's behalf.
#
# orderManagement feeds the daily brief's promiseHealth section and
# laborPerformance the flow-balance utilization overlay; the
# process-path-management client was removed entirely (ADR 0024, gap A9).
upstreams:
  wesWorkPlanning:
    endpoint: ""
  fulfillmentExecution:
    endpoint: ""
  inventoryStorage:
    endpoint: ""
  workforceManagement:
    endpoint: ""
  facilityLayout:
    endpoint: ""
  orderManagement:
    endpoint: ""
  laborPerformance:
    endpoint: ""
  # warehouse-planning (ADR 0013): its MCP server is read+write, but this
  # agent calls ONLY its four read tools. Empty = not configured: the
  # binary builds no client, the daily brief gets no capacityOutlook
  # section and nothing else changes. When set, the section is fail-open
  # per path (planning unreachable / no covering capacity window / path
  # not mapped via planningPathId in dailyBriefPathTargets = the section
  # carries an omittedReason, never a failed brief).
  warehousePlanning:
    endpoint: ""
  # product-master (ADR 0020): its MCP server is read-only (get_product,
  # list_products, get_product_classification, get_physical_profile on
  # :8090, Streamable HTTP at /mcp). Empty = not configured: no client, no
  # GET /master-data-gaps (503) and no find_master_data_gaps tool; nothing
  # else changes. In-cluster value:
  # http://product-master-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  productMaster:
    endpoint: ""
  # inbound-receiving (ADR 0021): its MCP server is read-only (get_asn,
  # list_asns, get_appointment, list_appointments, get_receipt,
  # list_receipts, list_docks on :8090, Streamable HTTP at /mcp). Empty =
  # not configured: no client, no GET /inbound-outlook (503) and no
  # get_inbound_outlook tool; nothing else changes. In-cluster value:
  # http://inbound-receiving-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  inboundReceiving:
    endpoint: ""
  # network-inventory-planning (ADR 0019): its MCP server publishes READ
  # tools only and this agent calls only those (get_transfer,
  # find_stuck_transfers, simulate_transfer_options). Empty = not
  # configured: the binary builds no client, the /transfer-watch/* routes
  # answer 503 and the triage_stuck_transfers / get_transfer_status /
  # explain_network_imbalance MCP tools are not registered. Moving,
  # approving or cancelling a transfer stays an operator action in NIP.
  networkInventoryPlanning:
    endpoint: ""
  # slotting-optimization (ADR 0024): its MCP server is read-only (four
  # tools published; this agent calls only get_slot_plan and
  # list_slot_plans). Empty = not configured: the binary builds no
  # client and the daily brief carries no slotPlanWatch section; nothing
  # else changes. When set, the section is fail-open per plan: an
  # unreachable slotting-optimization, a failed call or a
  # contract-breaking plan degrades to an explicit unavailable line on
  # the section, never a failed brief. In-cluster value:
  # http://slotting-optimization-mcp.warehouse-systems.svc.cluster.local:8090/mcp
  slottingOptimization:
    endpoint: ""
  # returns-processing: its MCP server is read-only (get_return,
  # list_returns_by_order, get_disposition_policy). Empty = not
  # configured: the binary builds no client (fail-open); no use case
  # consumes it yet, so nothing else changes.
  returnsProcessing:
    endpoint: ""
  # exception-management: its MCP server is read-only
  # (list_open_exceptions, get_exception, get_exception_policies,
  # get_sla_report). Empty = not configured: the binary builds no client
  # (fail-open); no use case consumes it yet, so nothing else changes.
  exceptionManagement:
    endpoint: ""

# warehouse-infra Prometheus base URL, for the telemetry-reader port's
# REAL implementation (already wired: cmd/agent's newTelemetryReader picks
# telemetry.NewPrometheusReader when this is set, telemetry.NewStubReader
# -- safe degrade, not an error -- when left empty).
prometheus:
  url: ""

# Observability reader wiring for GET /runtime-signals (Phase 5 Task 5.3):
# the Loki base URL for recent-error log sampling, plus the
# namespace/service-list the Prometheus+Loki queries are scoped to.
# Leaving lokiUrl empty keeps this agent's CURRENT behaviour byte-for-byte
# (newLogReader returns nil, RuntimeSignals reports the log source
# unavailable rather than guessing a URL) -- this chart never invents one
# on its behalf. namespace/services default to the binary's own built-in
# defaults (internal/config/config.go's "warehouse-systems" namespace and
# 8-service fleet list) when left empty/unset here.
runtimeSignals:
  lokiUrl: ""
  namespace: ""
  services: []

# Static credentials. All lands in one generated Secret unless
# existingSecret names a Secret you manage yourself (its key names must
# match the env var names read by internal/config).
credentials:
  existingSecret: ""
  # Anthropic API key for the ADR 0004 reasoner. Required (and validated
  # at startup) whenever llm.mode is not "off"; never logged.
  anthropicApiKey: ""

# ---------------------------------------------------------------------------
# Model-backed reasoner (ADR 0004). The deterministic policy always runs;
# mode decides whether the model's plan can replace its result:
#   off    - never call the model (default; pre-ADR behaviour byte-for-byte)
#   shadow - call it, log + count agreement, return the deterministic decision
#   on     - use a valid plan, fall back to deterministic on error/timeout/
#            out-of-vocabulary
# The model's ONLY actuators are the MCP read tools in toolAllowList
# (<upstream>/<tool>) -- REST and MCP are unauthenticated fleet-wide
# (ADR 0006), so this allow-list is what bounds the model, not a key/scope.
# ---------------------------------------------------------------------------
llm:
  mode: "off"
  model: ""          # empty = adapter default (claude-sonnet-4-5)
  timeout: "8s"
  toolAllowList: []  # empty = binary default (the flow-balance read tools)

# Deployment environment, exported as the deployment.environment.name
# resource attribute on every span and metric.
environment: "local"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a
# Collector; the service never exposes a Prometheus scrape endpoint of its
# own. An unreachable endpoint is not fatal -- the exporters dial lazily,
# so the pod still starts and serves, it just drops telemetry. Endpoint
# matches the rest of the fleet (fulfillment-execution, workforce-management,
# facility-layout).
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "warehouse-ops-agent"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
