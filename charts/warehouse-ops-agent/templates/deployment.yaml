apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warehouse-ops-agent.fullname" . }}
  labels:
    {{- include "warehouse-ops-agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "warehouse-ops-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "warehouse-ops-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "warehouse-ops-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # A single containerPort: every inbound REST route and the
            # inbound MCP server (/mcp) are both served off the same
            # chi.Mux on AGENT_ADDR (see cmd/agent/main.go) -- no second
            # port.
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # envFrom mounts every ConfigMap key (AGENT_ADDR, LOG_LEVEL,
          # CORS_ALLOWED_ORIGINS, DAILY_BRIEF_PATH_TARGETS, the
          # *_MCP_ENDPOINT, *_REST_URL and *_REPORTS_REST_URL keys,
          # PROMETHEUS_URL, LOKI_URL, RUNTIME_SIGNALS_*, LLM_*, OTEL_*). The
          # checksum/config annotation above restarts the pod when it
          # changes. Explicit `env:` entries below for some of the same
          # names take precedence over envFrom (standard Kubernetes merge).
          envFrom:
            - configMapRef:
                name: {{ include "warehouse-ops-agent.fullname" . }}
          env:
            - name: AGENT_ADDR
              value: {{ .Values.config.agentAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.dailyBriefPathTargets }}
            - name: DAILY_BRIEF_PATH_TARGETS
              value: {{ .Values.config.dailyBriefPathTargets | quote }}
            {{- end }}
            - name: WES_WORK_PLANNING_MCP_ENDPOINT
              value: {{ .Values.upstreams.wesWorkPlanning.endpoint | quote }}
            - name: FULFILLMENT_EXECUTION_MCP_ENDPOINT
              value: {{ .Values.upstreams.fulfillmentExecution.endpoint | quote }}
            - name: INVENTORY_STORAGE_MCP_ENDPOINT
              value: {{ .Values.upstreams.inventoryStorage.endpoint | quote }}
            - name: WORKFORCE_MANAGEMENT_MCP_ENDPOINT
              value: {{ .Values.upstreams.workforceManagement.endpoint | quote }}
            - name: FACILITY_LAYOUT_MCP_ENDPOINT
              value: {{ .Values.upstreams.facilityLayout.endpoint | quote }}
            - name: ORDER_MANAGEMENT_MCP_ENDPOINT
              value: {{ .Values.upstreams.orderManagement.endpoint | quote }}
            - name: LABOR_PERFORMANCE_MCP_ENDPOINT
              value: {{ .Values.upstreams.laborPerformance.endpoint | quote }}
            - name: WAREHOUSE_PLANNING_MCP_ENDPOINT
              value: {{ .Values.upstreams.warehousePlanning.endpoint | quote }}
            - name: PRODUCT_MASTER_MCP_ENDPOINT
              value: {{ .Values.upstreams.productMaster.endpoint | quote }}
            - name: INBOUND_RECEIVING_MCP_ENDPOINT
              value: {{ .Values.upstreams.inboundReceiving.endpoint | quote }}
            {{- if .Values.config.inboundStaleReceiptAge }}
            - name: INBOUND_STALE_RECEIPT_AGE
              value: {{ .Values.config.inboundStaleReceiptAge | quote }}
            {{- end }}
            - name: NETWORK_INVENTORY_PLANNING_MCP_ENDPOINT
              value: {{ .Values.upstreams.networkInventoryPlanning.endpoint | quote }}
            - name: SLOTTING_OPTIMIZATION_MCP_ENDPOINT
              value: {{ .Values.upstreams.slottingOptimization.endpoint | quote }}
            - name: RETURNS_PROCESSING_MCP_ENDPOINT
              value: {{ .Values.upstreams.returnsProcessing.endpoint | quote }}
            - name: EXCEPTION_MANAGEMENT_MCP_ENDPOINT
              value: {{ .Values.upstreams.exceptionManagement.endpoint | quote }}
            {{- if .Values.config.capacityOutlookHorizon }}
            - name: CAPACITY_OUTLOOK_HORIZON
              value: {{ .Values.config.capacityOutlookHorizon | quote }}
            {{- end }}
            {{- if .Values.config.slotPlanStaleAge }}
            - name: SLOT_PLAN_STALE_AGE
              value: {{ .Values.config.slotPlanStaleAge | quote }}
            {{- end }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- if ne .Values.llm.mode "off" }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warehouse-ops-agent.credentialsSecretName" . }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
