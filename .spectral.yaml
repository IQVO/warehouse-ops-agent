extends: ["spectral:oas"]
functionsDir: ".spectral/functions"
functions: [restGuideline]
rules:
  operation-operationId: error
  operation-description: error
  operation-tags: error
  info-description: error
  oas3-api-servers: error
  rest-guideline:
    description: "Warehouse REST API guideline R1-R8 (nouns not verbs, idempotent POST/PATCH, 409 key reuse, Idempotency-Replayed, keyset pagination)."
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: restGuideline
# Grandfathered rest-guideline findings. These four act-slice POST routes
# (ADR 0027, ADR 0029) predate this ruleset in this repo: they take no
# Idempotency-Key (R3/R5) and one has a verb segment (R2, ".../approve").
# The code does not implement the guideline yet, so documenting the headers
# would make the spec lie. Each override is scoped to ONE path, so any NEW
# route (or any other rule on these routes) is still linted. Remove an entry
# when its route adopts the guideline; tracked in
# https://github.com/IQVO/warehouse-ops-agent/issues/211
overrides:
  - files:
      - "apis/openapi.yaml#/paths/~1act~1release-next-work~1proposals"
      - "apis/openapi.yaml#/paths/~1act~1release-next-work~1approvals"
      - "apis/openapi.yaml#/paths/~1labor-reallocation~1proposals"
      - "apis/openapi.yaml#/paths/~1labor-reallocation~1proposals~1%7BproposalId%7D~1approve"
    rules:
      rest-guideline: "off"
